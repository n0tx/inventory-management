name: Test Secrets

on: [workflow_dispatch]

jobs:
  test-secrets:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Print DOCKER_USERNAME (for debugging; remove after verification)
      run: echo "DOCKER_USERNAME is ${{ secrets.DOCKER_USERNAME }}"
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    - name: Verify DOCKER_PASSWORD secret (for debugging; remove after verification)
      run: echo "DOCKER_PASSWORD is set"
      env:
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
